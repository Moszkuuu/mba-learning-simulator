const lessons=[
{title:'Revenue, COGS & Gross Profit',concept:'Revenue is sales recognized during a period. Cost of goods sold (COGS) is the direct cost of goods sold, not necessarily cash paid to suppliers. Gross profit = revenue − COGS. Gross margin = gross profit ÷ revenue × 100%.',example:'A distributor sells $150,000 and reports COGS of $90,000. Gross profit = $60,000; gross margin = 40%.',qs:[['Revenue is $200,000 and COGS is $120,000. Gross profit?',80000, 'Subtract COGS from revenue.'],['Revenue is $200,000 and COGS is $120,000. Gross margin (%)?',40,'Divide gross profit by revenue, then multiply by 100.'],['Revenue is $300,000 and gross margin is 30%. COGS?',210000,'COGS equals revenue × (1 − margin).'],['Revenue rises from $100,000 to $125,000. Growth (%)?',25,'Growth is change divided by original revenue.'],['Revenue is $500,000, COGS $325,000. Gross margin (%)?',35,'First calculate gross profit.']]},
{title:'Operating Profit & Margins',concept:'Operating profit = revenue − COGS − operating expenses. Operating profit margin = operating profit ÷ revenue × 100%. Profit is an amount; margin is a percentage.',example:'Revenue $150,000; COGS $90,000; operating expenses $35,000. Operating profit = $25,000 and margin = 16.67%.',qs:[['Revenue $250,000, COGS $150,000, expenses $60,000. Operating profit?',40000,'Subtract both direct and operating costs.'],['Operating profit $30,000 on revenue $200,000. Operating margin (%)?',15,'Divide operating profit by revenue.'],['Revenue $100,000, COGS $60,000, expenses $25,000. Operating profit?',15000,'Revenue less COGS and operating expenses.'],['Revenue $500,000, operating margin 12%. Operating profit?',60000,'Multiply revenue by margin.'],['Revenue $300,000, COGS $180,000, expenses $90,000. Operating margin (%)?',10,'Calculate operating profit, then divide by revenue.']]},
{title:'Receivables & Payables',concept:'Accounts receivable (AR) is money customers owe; accounts payable (AP) is money owed to suppliers. Increasing AR generally uses cash; increasing AP generally preserves cash in the short term. Revenue and COGS are not cash receipts or payments.',example:'AR increases by $20,000 while AP increases by $5,000: the combined working-capital cash effect is −$15,000, before other items.',qs:[['AR increases from $50,000 to $80,000. Cash effect ($; use negative for outflow)?',-30000,'An increase in receivables absorbs cash.'],['AP increases from $20,000 to $35,000. Cash effect ($)?',15000,'An increase in payables defers cash payments.'],['Annual revenue $365,000; AR $30,000. Approximate DSO (days, year-end basis)?',30,'DSO ≈ AR ÷ annual revenue × 365.'],['AR falls by $12,000. Cash effect ($)?',12000,'Collecting receivables releases cash.'],['AP falls by $8,000. Cash effect ($)?',-8000,'Paying down supplier balances consumes cash.']]},
{title:'Inventory & Working Capital',concept:'Net operating working capital (NOWC) = AR + inventory − AP. An increase in NOWC ties up operating cash. Inventory on the balance sheet represents goods held, not warehouse rent.',example:'Year 1: AR 10k + inventory 15k − AP 8k = 17k. Year 2: 25k + 30k − 13k = 42k. NOWC increases by 25k.',qs:[['AR $30,000, inventory $50,000, AP $20,000. NOWC?',60000,'Add AR and inventory, subtract AP.'],['NOWC rises from $70,000 to $95,000. Increase?',25000,'Subtract opening from closing NOWC.'],['Inventory rises by $15,000 with all else constant. Cash effect?',-15000,'Additional inventory ties up cash.'],['AR $50k, inventory $40k, AP $35k. NOWC ($)?',55000,'NOWC = AR + inventory − AP.'],['Inventory $120k falls by 25%. New inventory ($)?',90000,'Multiply starting inventory by 75%.']]},
{title:'Operating Cash Flow',concept:'For our simplified exercises, operating cash flow (OCF) = operating profit − increase in NOWC. This assumes no taxes, interest, depreciation, or other operating adjustments. OCF is not the same as ending bank cash.',example:'Operating profit $100k; AR rises $30k; inventory rises $20k; AP rises $10k. OCF = 100k − 30k − 20k + 10k = $60k.',qs:[['Operating profit $50k; NOWC rises $20k. OCF?',30000,'Subtract the increase in NOWC.'],['Operating profit $25k; NOWC rises $25k. OCF?',0,'Working-capital investment offsets profit.'],['Profit $80k; AR +$20k; inventory +$10k; AP +$5k. OCF?',55000,'Subtract AR and inventory increases; add AP increase.'],['Profit $40k; NOWC falls $15k. OCF?',55000,'A decrease in NOWC releases cash.'],['Profit $100k; AR +$50k; inventory +$40k; AP +$10k. OCF?',20000,'Reconcile each working-capital movement.']]},
{title:'Break-Even Analysis',concept:'Contribution margin ratio = 1 − variable cost ratio. Break-even revenue = fixed costs ÷ contribution margin ratio. Growth helps only when incremental contribution justifies the costs and financing needs.',example:'Fixed costs $250,000; variable costs 50% of revenue. Break-even revenue = $250,000 ÷ 0.5 = $500,000.',qs:[['Fixed costs $100k; variable cost ratio 60%. Break-even revenue?',250000,'Contribution margin ratio is 40%.'],['Revenue $300k, variable costs $180k. Contribution margin ($)?',120000,'Revenue minus variable costs.'],['Fixed costs $200k, contribution margin ratio 25%. Break-even revenue?',800000,'Divide fixed costs by contribution margin ratio.'],['Additional revenue $100k, variable cost ratio 70%. Incremental contribution?',30000,'Only 30% of additional revenue contributes to fixed costs and profit.'],['Fixed costs $150k; variable cost ratio 50%; revenue $400k. Operating profit?',50000,'Contribution minus fixed costs.']]}];

['กำไรดำเนินงานและอัตรากำไร','กำไรดำเนินงาน = รายได้ − ต้นทุนขาย − ค่าใช้จ่ายดำเนินงาน อัตรากำไรดำเนินงาน = กำไรดำเนินงาน ÷ รายได้ × 100% กำไรเป็นจำนวนเงิน แต่อัตรากำไรเป็นเปอร์เซ็นต์','รายได้ $150,000 ต้นทุนขาย $90,000 ค่าใช้จ่าย $35,000 กำไรดำเนินงาน $25,000 และอัตรากำไร 16.67%', ['รายได้ $250,000 ต้นทุนขาย $150,000 ค่าใช้จ่าย $60,000 กำไรดำเนินงาน?','กำไรดำเนินงาน $30,000 รายได้ $200,000 อัตรากำไรดำเนินงาน (%)?','รายได้ $100,000 ต้นทุนขาย $60,000 ค่าใช้จ่าย $25,000 กำไรดำเนินงาน?','รายได้ $500,000 อัตรากำไรดำเนินงาน 12% กำไรดำเนินงาน?','รายได้ $300,000 ต้นทุนขาย $180,000 ค่าใช้จ่าย $90,000 อัตรากำไรดำเนินงาน (%)?']],
['ลูกหนี้และเจ้าหนี้การค้า','ลูกหนี้การค้า (AR) คือเงินที่ลูกค้ายังค้างจ่าย เจ้าหนี้การค้า (AP) คือเงินที่ค้างจ่ายซัพพลายเออร์ ลูกหนี้เพิ่มมักใช้เงินสด ส่วนเจ้าหนี้เพิ่มช่วยชะลอการจ่ายเงินในระยะสั้น','ลูกหนี้เพิ่ม $20,000 เจ้าหนี้เพิ่ม $5,000 ผลกระทบต่อเงินสดจากสองรายการรวมกัน = −$15,000',['ลูกหนี้เพิ่มจาก $50,000 เป็น $80,000 ผลต่อเงินสด ($; ติดลบเมื่อเงินออก)?','เจ้าหนี้เพิ่มจาก $20,000 เป็น $35,000 ผลต่อเงินสด ($)?','รายได้ต่อปี $365,000 ลูกหนี้ $30,000 ระยะเวลาเก็บหนี้โดยประมาณ (วัน)?','ลูกหนี้ลดลง $12,000 ผลต่อเงินสด ($)?','เจ้าหนี้ลดลง $8,000 ผลต่อเงินสด ($)?']],
['สินค้าคงคลังและเงินทุนหมุนเวียน','เงินทุนหมุนเวียนดำเนินงานสุทธิ (NOWC) = ลูกหนี้ + สินค้าคงคลัง − เจ้าหนี้ เมื่อ NOWC เพิ่ม เงินสดจะถูกผูกไว้มากขึ้น มูลค่าสินค้าคงคลังไม่ใช่ค่าเช่าคลังสินค้า','ปี 1: 10k + 15k − 8k = 17k ปี 2: 25k + 30k − 13k = 42k ดังนั้น NOWC เพิ่ม 25k',['ลูกหนี้ $30,000 สต็อก $50,000 เจ้าหนี้ $20,000 NOWC?','NOWC เพิ่มจาก $70,000 เป็น $95,000 เพิ่มเท่าไร?','สต็อกเพิ่ม $15,000 รายการอื่นคงเดิม ผลต่อเงินสด?','ลูกหนี้ $50k สต็อก $40k เจ้าหนี้ $35k NOWC ($)?','สต็อก $120k ลดลง 25% สต็อกใหม่ ($)?']],
['กระแสเงินสดจากการดำเนินงาน','สำหรับโจทย์แบบง่าย OCF = กำไรดำเนินงาน − การเพิ่มขึ้นของ NOWC โดยสมมติว่าไม่มีภาษี ดอกเบี้ย ค่าเสื่อมราคา หรือรายการปรับปรุงอื่น OCF ไม่ใช่ยอดเงินสดปลายงวด','กำไร $100k ลูกหนี้เพิ่ม $30k สต็อกเพิ่ม $20k เจ้าหนี้เพิ่ม $10k ดังนั้น OCF = 100k − 30k − 20k + 10k = $60k',['กำไรดำเนินงาน $50k NOWC เพิ่ม $20k OCF?','กำไรดำเนินงาน $25k NOWC เพิ่ม $25k OCF?','กำไร $80k ลูกหนี้ +$20k สต็อก +$10k เจ้าหนี้ +$5k OCF?','กำไร $40k NOWC ลดลง $15k OCF?','กำไร $100k ลูกหนี้ +$50k สต็อก +$40k เจ้าหนี้ +$10k OCF?']],
['การวิเคราะห์จุดคุ้มทุน','อัตรากำไรส่วนเกิน = 1 − อัตราต้นทุนผันแปร รายได้จุดคุ้มทุน = ต้นทุนคงที่ ÷ อัตรากำไรส่วนเกิน การเติบโตมีประโยชน์เมื่อกำไรส่วนเกินที่เพิ่มขึ้นคุ้มต้นทุนและเงินทุนที่ต้องใช้','ต้นทุนคงที่ $250,000 ต้นทุนผันแปร 50% ของรายได้ รายได้จุดคุ้มทุน = $250,000 ÷ 0.5 = $500,000',['ต้นทุนคงที่ $100k อัตราต้นทุนผันแปร 60% รายได้จุดคุ้มทุน?','รายได้ $300k ต้นทุนผันแปร $180k กำไรส่วนเกิน ($)?','ต้นทุนคงที่ $200k อัตรากำไรส่วนเกิน 25% รายได้จุดคุ้มทุน?','รายได้เพิ่ม $100k อัตราต้นทุนผันแปร 70% กำไรส่วนเกินที่เพิ่ม?','ต้นทุนคงที่ $150k อัตราต้นทุนผันแปร 50% รายได้ $400k กำไรดำเนินงาน?']]
];
const englishLessons=lessons.map(l=>({title:l.title,concept:l.concept,example:l.example,qs:l.qs.map(q=>[...q])}));
let language=localStorage.getItem('mba-lang')==='th'?'th':'en';
function setLanguage(v){language=v;localStorage.setItem('mba-lang',v);lessons.forEach((l,i)=>{const src=v==='th'?thaiLessons[i]:null,orig=englishLessons[i];l.title=src?src[0]:orig.title;l.concept=src?src[1]:orig.concept;l.example=src?src[2]:orig.example;l.qs.forEach((q,j)=>{q[0]=src?src[3][j]:orig.qs[j][0];q[2]=orig.qs[j][2]})});render()}
function translateUI(){document.documentElement.lang=language;document.getElementById('langEN').setAttribute('aria-pressed',language==='en');document.getElementById('langTH').setAttribute('aria-pressed',language==='th');if(language!=='th')return;const root=document.body;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(node.parentElement?.closest('script,style'))continue;const raw=node.nodeValue,trim=raw.trim();if(!trim)continue;const match=TH[trim];if(match)node.nodeValue=raw.replace(trim,match);else if(trim.startsWith('Practice — '))node.nodeValue=raw.replace('Practice — ','แบบฝึกหัด — ')}for(const el of root.querySelectorAll('[placeholder]')){if(el.placeholder==='Your answer')el.placeholder='คำตอบของคุณ';else if(el.tagName==='TEXTAREA')el.placeholder='เขียนคำแนะนำของคุณ (บันทึกในอุปกรณ์นี้)'}}

function render(){nav();let html='';if(view==='dashboard'){const done=Object.keys(state.completed).length;const attempts=state.history.length;const avg=attempts?state.history.reduce((a,b)=>a+b.score,0)/attempts:0;html=`<h2>Learning Dashboard</h2><div class="grid"><div class="metric">Lessons completed<strong>${done}/6</strong></div><div class="metric">Average quiz score<strong>${pct(avg)}</strong></div><div class="metric">Practice attempts<strong>${attempts}</strong></div><div class="metric">Simulation month<strong>${state.sim?.month||0}/12</strong></div></div><div class="card"><h3>Your learning path</h3><div class="progress"><div style="width:${done/6*100}%"></div></div><p class="muted">Start with profit margins, then working capital and cash flow. Complete numerical exercises before the CEO simulation.</p><button class="primary" onclick="navigate('lessons')">Start learning</button> <button onclick="navigate('sim')">Run a business</button></div><div class="card"><h3>Curriculum</h3><p><span class="tag">Financial Accounting — available</span> <span class="tag">Economics — coming later</span> <span class="tag">Corporate Finance — coming later</span> <span class="tag">Marketing — coming later</span> <span class="tag">Operations — coming later</span> <span class="tag">Strategy — coming later</span></p></div>`}
if(view==='lessons'){html=`<h2>Financial Accounting</h2><p class="muted">Six short lessons with worked examples and five practice calculations each.</p><div class="card lesson-list">${lessons.map((l,i)=>`<button onclick="openLesson(${i})">${state.completed[i]?'✓ ':''}${i+1}. ${esc(l.title)} →</button>`).join('')}</div>`}
if(view==='practice'){const l=lessons[lessonIdx];html=`<h2>Practice — ${esc(l.title)}</h2><div class="row"><button onclick="navigate('lessons')">← Lessons</button><select onchange="openLesson(Number(this.value))">${lessons.map((x,i)=>`<option value="${i}" ${i===lessonIdx?'selected':''}>${i+1}. ${esc(x.title)}</option>`).join('')}</select></div><div class="card"><h3>Concept</h3><p>${esc(l.concept)}</p><h3>Worked example</h3><p>${esc(l.example)}</p></div><div class="card"><h3>Practice calculations</h3><p class="muted">Enter numbers only. For percentage questions, enter the percentage number (e.g., 40). Tolerance: ±0.1% or ±$1.</p>${l.qs.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q[0])}</b><input type="number" step="any" id="ans${i}" value="${answers[i]??''}" ${submitted?'disabled':''} placeholder="Your answer"><details><summary>Hint</summary><p>${esc(q[2])}</p></details>${submitted?feedback(q,answers[i],i):''}</div>`).join('')}${submitted?`<button onclick="openLesson(${lessonIdx})">Try again</button> <button class="primary" onclick="openLesson(${Math.min(lessonIdx+1,5)})">Next lesson →</button>`:`<button class="primary" onclick="gradeLesson()">Submit answers</button>`}</div>`}
if(view==='case'){html=`<h2>Homework — The Profitable Distributor</h2><p class="muted">Target: 45–60 minutes. The figures match your earlier MBA homework.</p><div class="card"><h3>Business information</h3><table><tr><th>Metric</th><th>2025</th><th>2026</th></tr>${[['Revenue',2000000,2600000],['COGS',1200000,1690000],['Operating expenses',500000,550000],['Accounts receivable',200000,400000],['Inventory',300000,450000],['Accounts payable',150000,200000],['Bank cash',250000,120000]].map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td><td>${money(x[2])}</td></tr>`).join('')}</table><p class="small">Supermarkets account for 70% of revenue (60–90 day terms); restaurants 30% (15–30 day terms). Some products have six months of shelf life remaining. Sales expects 25% revenue growth next year. Ignore taxes, interest, depreciation and other OCF adjustments.</p></div><div class="card"><h3>Part 1 — Calculations</h3>${caseQuestions.map((q,i)=>`<div class="question"><b>${i+1}. ${q.label}</b><input type="number" step="any" id="case${i}" value="${caseAnswers[i]??''}" ${caseSubmitted?'disabled':''}>${caseSubmitted?`<div class="feedback ${near(caseAnswers[i],q.answer)?'good':'bad'}">${near(caseAnswers[i],q.answer)?'Correct. ':'Review: '}${q.why}</div>`:''}</div>`).join('')}<h3>Part 2 — Management judgment</h3><p>Why might bank cash fall despite rising profit? Identify two risks, then recommend one action (customer credit terms, inventory optimization, or supplier negotiations). Explain trade-offs.</p><textarea id="caseWritten" placeholder="Write your recommendation; this is saved locally but is not automatically AI-graded.">${esc(state.caseWritten||'')}</textarea><div class="row" style="margin-top:12px"><button onclick="saveCaseText()">Save written answer</button><button class="primary" onclick="gradeCase()">Grade calculations</button></div>${caseSubmitted?'<p class="warning">Written decisions require human review. A numeric score alone does not assess business judgment.</p>':''}</div>`}
if(view==='sim')html=simHTML();
if(view==='review'){html=`<h2>Mistake Journal</h2><div class="card"><p class="muted">Review mistakes before each new lesson. Entries are saved in this browser.</p>${state.mistakes.length?state.mistakes.slice().reverse().map(x=>`<div class="question"><b>${esc(x.topic)}</b><p>${esc(x.question)}</p><p class="bad">Your answer: ${esc(x.given)}</p><p class="good">Expected: ${esc(x.correct)}</p><p>${esc(x.why)}</p></div>`).join(''):'<p>No mistakes recorded yet. Start a practice lesson.</p>'}</div><div class="card"><h3>Your data</h3><button onclick="exportData()">Export progress (.json)</button> <button onclick="importData()">Import progress</button> <button onclick="resetAll()">Reset all progress</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="loadData(event)"><p class="small muted">Progress stays on this browser. Export and import the JSON file to transfer it to another device.</p></div>`}
$('app').innerHTML=html;translateUI()}
function near(a,b){if(a===''||a===undefined||a===null||!Number.isFinite(Number(a)))return false;return Math.abs(Number(a)-b)<=Math.max(1,Math.abs(b)*0.0001)}function feedback(q,v,i){const ok=near(v,q[1]);return `<div class="feedback ${ok?'good':'bad'}">${ok?'Correct.':'Incorrect. '}Expected ${Number(q[1]).toLocaleString('en-US')}. ${esc(q[2])}</div>`}function openLesson(i){lessonIdx=i;answers={};submitted=false;view='practice';render()}function gradeLesson(){let score=0;const qs=lessons[lessonIdx].qs;qs.forEach((q,i)=>{const raw=$('ans'+i).value;answers[i]=raw;if(near(raw,q[1]))score++;else state.mistakes.push({topic:lessons[lessonIdx].title,question:q[0],given:raw||'(blank)',correct:q[1],why:q[2]})});const percent=score/qs.length*100;state.history.push({topic:lessons[lessonIdx].title,score:percent,date:new Date().toISOString()});if(percent>=80)state.completed[lessonIdx]=true;submitted=true;save();render();$('app').insertAdjacentHTML('afterbegin',`<div class="${percent>=80?'ok':'warning'}">Score: ${score}/5 (${percent}%). ${percent>=80?'Lesson passed.':'Review the explanations and retry.'}</div>`)}function saveCaseText(){state.caseWritten=$('caseWritten').value;save();alert('Written answer saved in this browser.')}function gradeCase(){saveCaseText();caseQuestions.forEach((q,i)=>{caseAnswers[i]=$('case'+i).value;if(!near(caseAnswers[i],q.answer))state.mistakes.push({topic:'Business case',question:q.label,given:caseAnswers[i]||'(blank)',correct:q.answer,why:q.why})});const n=caseQuestions.filter((q,i)=>near(caseAnswers[i],q.answer)).length;state.history.push({topic:'Business case calculations',score:n*25,date:new Date().toISOString()});caseSubmitted=true;save();render();$('app').insertAdjacentHTML('afterbegin',`<div class="ok">Calculations: ${n}/4 correct. Review your written decision separately.</div>`)}
function initialSim(){return {month:0,cash:500000,inventory:300000,ar:400000,ap:150000,monthlyRevenue:200000,fixed:60000,price:0,marketing:0,terms:60,supplierTerms:30,receivableQueue:[200000,200000],payableQueue:[150000],history:[],status:'active'}}
function simHTML(){const s=state.sim||initialSim();const finished=s.month>=12||s.status!=='active';return `<h2>CEO Simulator — Food Distributor</h2><p class="muted">Run a 12-month company. Your decisions change demand, inventory, profit and cash. Model assumptions are shown below.</p><div class="grid">${[['Month',s.month+'/12'],['Cash',money(s.cash)],['Inventory',money(s.inventory)],['Receivables',money(s.ar)],['Payables',money(s.ap)],['Status',s.status]].map(([k,v])=>`<div class="metric">${k}<strong style="font-size:20px">${v}</strong></div>`).join('')}</div><div class="card"><h3>${finished?'Simulation summary':'Next month — your decisions'}</h3>${finished?`<p>${s.status==='insolvent'?'The company ran out of cash. Review your decisions and restart.':'You completed 12 months. Compare cash, profits and growth.'}</p><button class="primary" onclick="restartSim()">Start new game</button>`:`<div class="grid"><label class="field">Price change (%)<select id="price"><option value="-5">−5%</option><option value="0" selected>No change</option><option value="5">+5%</option><option value="10">+10%</option></select></label><label class="field">Extra marketing ($)<select id="marketing"><option value="0">$0</option><option value="5000">$5,000</option><option value="15000">$15,000</option></select></label><label class="field">Inventory purchase at cost ($)<input id="purchase" type="number" min="0" max="500000" step="5000" value="110000"></label><label class="field">Customer credit (days)<select id="terms"><option value="30">30 days</option><option value="60" selected>60 days</option><option value="90">90 days</option></select></label><label class="field">Supplier credit (days)<select id="supplier"><option value="30" selected>30 days</option><option value="60">60 days</option><option value="90">90 days</option></select></label></div><p><button class="primary" onclick="advanceSim()">Run next month →</button> <button onclick="restartSim()">Restart</button></p>`}<details><summary>Financial model and assumptions</summary><p class="small">Baseline monthly demand is $200k at original prices; baseline gross margin is 35%, so cost of goods sold is 65% of realized sales. A 1% price increase reduces units demanded by 1.5%; a 1% price cut increases units demanded by 1.5%. Marketing increases demand by 2× its spend (e.g., $5k spend raises baseline demand by $10k). Marketing is expensed in the month paid. Purchases enter inventory before sales; sales are capped by inventory at cost. Fixed expenses are $60k paid monthly. Customer collections are delayed by the selected terms (30/60/90 days ≈ 1/2/3 months); supplier payments follow a corresponding delay. Changes to credit terms apply only to new transactions. Initial AR $400k is collected $200k in each of months 1–2. Initial AP $150k is paid in month 1. No interest, taxes, shrinkage, depreciation, borrowing or bad debts. If cash falls below zero, the game ends; real businesses may have financing alternatives. This is an educational approximation, not a full accounting system.</p></details></div><div class="card"><h3>Monthly results</h3>${s.history.length?`<div style="overflow:auto"><table><tr><th>Month</th><th>Sales</th><th>Profit</th><th>Cash</th><th>Inventory</th></tr>${s.history.map(x=>`<tr><td>${x.month}</td><td>${money(x.sales)}</td><td>${money(x.profit)}</td><td>${money(x.cash)}</td><td>${money(x.inventory)}</td></tr>`).join('')}</table></div><p class="muted small">Compare operating profit with cash movement. A profitable month can still reduce cash.</p>`:'<p class="muted">No months simulated yet.</p>'}</div>`}
function advanceSim(){const s=state.sim||initialSim();if(s.month>=12||s.status!=='active')return;const price=Number($('price').value),marketing=Number($('marketing').value),purchase=Number($('purchase').value),terms=Number($('terms').value),supplier=Number($('supplier').value);if(!Number.isFinite(purchase)||purchase<0||purchase>500000){alert('Purchase must be between $0 and $500,000.');return}const newMonth=s.month+1;const salesBase=200000*(1-1.5*price/100)+2*marketing;const potentialSales=Math.max(0,salesBase*(1+price/100));const margin=1-0.65/(1+price/100);const stock=s.inventory+purchase;const sales=Math.min(potentialSales,stock/(1-margin));const cogs=sales*(1-margin),profit=sales-cogs-s.fixed-marketing;let recQueue=s.receivableQueue.slice(),payQueue=s.payableQueue.slice();const collection=recQueue.shift()||0,payment=payQueue.shift()||0;const receivableDelay=terms/30,payableDelay=supplier/30;while(recQueue.length<receivableDelay)recQueue.push(0);recQueue[receivableDelay-1]+=sales;while(payQueue.length<payableDelay)payQueue.push(0);payQueue[payableDelay-1]+=purchase;const cash=s.cash+collection-payment-s.fixed-marketing;const inv=Math.max(0,stock-cogs);s.month=newMonth;s.cash=cash;s.inventory=inv;s.ar=recQueue.reduce((a,b)=>a+b,0);s.ap=payQueue.reduce((a,b)=>a+b,0);s.receivableQueue=recQueue;s.payableQueue=payQueue;s.history.push({month:newMonth,sales,profit,cash,inventory:inv,collections:collection,supplierPayments:payment,marketing,purchase});if(cash<0)s.status='insolvent';state.sim=s;save();render();const note=`Month ${newMonth}: ${money(sales)} sales, ${money(profit)} operating profit, ${money(collection)} customer collections, ${money(payment)} supplier payments. Cash ${money(cash)}.`;$('app').insertAdjacentHTML('afterbegin',`<div class="${cash<0?'warning':'ok'}">${note} ${sales<potentialSales-1?'Inventory constrained sales.':''}</div>`)}
function restartSim(){if(!confirm('Restart simulation and discard the current run?'))return;state.sim=initialSim();save();render()}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mba-learning-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(){$('importFile').click()}function loadData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||typeof obj!=='object'||!Array.isArray(obj.history)||!Array.isArray(obj.mistakes))throw Error('Invalid format');state=obj;state.completed=state.completed||{};save();render();alert('Progress imported.')}catch(err){alert('Unable to import: '+err.message)}};r.readAsText(f)}function resetAll(){if(!confirm('Delete all saved learning progress on this browser?'))return;localStorage.removeItem(key);state={completed:{},history:[],mistakes:[],sim:null};render()}setLanguage(language);
</script></body></html>
